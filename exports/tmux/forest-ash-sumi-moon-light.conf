# Forest Ash Theme — tmux Configuration
# Generated: 2026-07-19
# Usage: add to your ~/.tmux.conf:
#   source-file ~/.tmux/themes/forest-ash.conf
# Or paste directly into ~/.tmux.conf

# ── Pane borders ──────────────────────────────────────────────────────────────
set -g pane-border-style "fg=#B4B0CA"
set -g pane-active-border-style "fg=#353041"

# ── Status bar ────────────────────────────────────────────────────────────────
set -g status "on"
set -g status-bg "#EEEDF2"
set -g status-fg "#353041"
set -g status-left-style "fg=#353041,bg=#EEEEF2"
set -g status-right-style "fg=#353041,bg=#EEEEF2"
set -g status-left " #[fg=#353041,bold]#S #[fg=#B4B0CA]│ "
set -g status-right "#[fg=#766699] %H:%M #[fg=#B4B0CA]│ #[fg=#353041]#H "

# ── Window tabs ───────────────────────────────────────────────────────────────
set -g window-status-style "fg=#766699,bg=#EEEEF2"
set -g window-status-current-style "fg=#353041,bg=#F6F6F8,bold"
set -g window-status-format "  #I:#W  "
set -g window-status-current-format " #[fg=#353041]▎#[fg=#353041]#I:#W  "
set -g window-status-separator ""

# ── Messages ──────────────────────────────────────────────────────────────────
set -g message-style "fg=#353041,bg=#EEEEF2"
set -g message-command-style "fg=#353041,bg=#EEEEF2"

# ── Selection ─────────────────────────────────────────────────────────────────
set -g mode-style "fg=#F6F6F8,bg=#353041"

# ── Clock ─────────────────────────────────────────────────────────────────────
set -g clock-mode-colour "#353041"

# ── Copy mode ─────────────────────────────────────────────────────────────────
set -wg copy-mode-match-style "fg=#F6F6F8,bg=#493286"
set -wg copy-mode-current-match-style "fg=#F6F6F8,bg=#353041"
