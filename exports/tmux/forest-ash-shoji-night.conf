# Forest Ash Theme — tmux Configuration
# Generated: 2026-07-19
# Usage: add to your ~/.tmux.conf:
#   source-file ~/.tmux/themes/forest-ash.conf
# Or paste directly into ~/.tmux.conf

# ── Pane borders ──────────────────────────────────────────────────────────────
set -g pane-border-style "fg=#314750"
set -g pane-active-border-style "fg=#8BC6D9"

# ── Status bar ────────────────────────────────────────────────────────────────
set -g status "on"
set -g status-bg "#1C262C"
set -g status-fg "#D8E0E4"
set -g status-left-style "fg=#D8E0E4,bg=#141B20"
set -g status-right-style "fg=#D8E0E4,bg=#141B20"
set -g status-left " #[fg=#D8E0E4,bold]#S #[fg=#314750]│ "
set -g status-right "#[fg=#7A8A92] %H:%M #[fg=#314750]│ #[fg=#D8E0E4]#H "

# ── Window tabs ───────────────────────────────────────────────────────────────
set -g window-status-style "fg=#7A8A92,bg=#141B20"
set -g window-status-current-style "fg=#8BC6D9,bg=#10161A,bold"
set -g window-status-format "  #I:#W  "
set -g window-status-current-format " #[fg=#8BC6D9]▎#[fg=#D8E0E4]#I:#W  "
set -g window-status-separator ""

# ── Messages ──────────────────────────────────────────────────────────────────
set -g message-style "fg=#D8E0E4,bg=#141B20"
set -g message-command-style "fg=#D8E0E4,bg=#141B20"

# ── Selection ─────────────────────────────────────────────────────────────────
set -g mode-style "fg=#10161A,bg=#8BC6D9"

# ── Clock ─────────────────────────────────────────────────────────────────────
set -g clock-mode-colour "#8BC6D9"

# ── Copy mode ─────────────────────────────────────────────────────────────────
set -wg copy-mode-match-style "fg=#10161A,bg=#87BFD0"
set -wg copy-mode-current-match-style "fg=#10161A,bg=#8BC6D9"
