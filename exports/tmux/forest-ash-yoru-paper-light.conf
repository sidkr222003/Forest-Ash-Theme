# Forest Ash Theme — tmux Configuration
# Generated: 2026-07-19
# Usage: add to your ~/.tmux.conf:
#   source-file ~/.tmux/themes/forest-ash.conf
# Or paste directly into ~/.tmux.conf

# ── Pane borders ──────────────────────────────────────────────────────────────
set -g pane-border-style "fg=#B4C5BF"
set -g pane-active-border-style "fg=#313F31"

# ── Status bar ────────────────────────────────────────────────────────────────
set -g status "on"
set -g status-bg "#EEF1F2"
set -g status-fg "#313F31"
set -g status-left-style "fg=#313F31,bg=#EDF0F2"
set -g status-right-style "fg=#313F31,bg=#EDF0F2"
set -g status-left " #[fg=#313F31,bold]#S #[fg=#B4C5BF]│ "
set -g status-right "#[fg=#66998D] %H:%M #[fg=#B4C5BF]│ #[fg=#313F31]#H "

# ── Window tabs ───────────────────────────────────────────────────────────────
set -g window-status-style "fg=#66998D,bg=#EDF0F2"
set -g window-status-current-style "fg=#313F31,bg=#F6F7F8,bold"
set -g window-status-format "  #I:#W  "
set -g window-status-current-format " #[fg=#313F31]▎#[fg=#313F31]#I:#W  "
set -g window-status-separator ""

# ── Messages ──────────────────────────────────────────────────────────────────
set -g message-style "fg=#313F31,bg=#EDF0F2"
set -g message-command-style "fg=#313F31,bg=#EDF0F2"

# ── Selection ─────────────────────────────────────────────────────────────────
set -g mode-style "fg=#F6F7F8,bg=#313F31"

# ── Clock ─────────────────────────────────────────────────────────────────────
set -g clock-mode-colour "#313F31"

# ── Copy mode ─────────────────────────────────────────────────────────────────
set -wg copy-mode-match-style "fg=#F6F7F8,bg=#328664"
set -wg copy-mode-current-match-style "fg=#F6F7F8,bg=#313F31"
