# Forest Ash Theme — tmux Configuration
# Generated: 2026-07-19
# Usage: add to your ~/.tmux.conf:
#   source-file ~/.tmux/themes/forest-ash.conf
# Or paste directly into ~/.tmux.conf

# ── Pane borders ──────────────────────────────────────────────────────────────
set -g pane-border-style "fg=#CEB9AB"
set -g pane-active-border-style "fg=#46372A"

# ── Status bar ────────────────────────────────────────────────────────────────
set -g status "on"
set -g status-bg "#F3EFEC"
set -g status-fg "#46372A"
set -g status-left-style "fg=#46372A,bg=#F2EFED"
set -g status-right-style "fg=#46372A,bg=#F2EFED"
set -g status-left " #[fg=#46372A,bold]#S #[fg=#CEB9AB]│ "
set -g status-right "#[fg=#997E66] %H:%M #[fg=#CEB9AB]│ #[fg=#46372A]#H "

# ── Window tabs ───────────────────────────────────────────────────────────────
set -g window-status-style "fg=#997E66,bg=#F2EFED"
set -g window-status-current-style "fg=#46372A,bg=#F8F7F6,bold"
set -g window-status-format "  #I:#W  "
set -g window-status-current-format " #[fg=#46372A]▎#[fg=#46372A]#I:#W  "
set -g window-status-separator ""

# ── Messages ──────────────────────────────────────────────────────────────────
set -g message-style "fg=#46372A,bg=#F2EFED"
set -g message-command-style "fg=#46372A,bg=#F2EFED"

# ── Selection ─────────────────────────────────────────────────────────────────
set -g mode-style "fg=#F8F7F6,bg=#46372A"

# ── Clock ─────────────────────────────────────────────────────────────────────
set -g clock-mode-colour "#46372A"

# ── Copy mode ─────────────────────────────────────────────────────────────────
set -wg copy-mode-match-style "fg=#F8F7F6,bg=#865D32"
set -wg copy-mode-current-match-style "fg=#F8F7F6,bg=#46372A"
