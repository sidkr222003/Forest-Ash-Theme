# Forest Ash Theme — tmux Configuration
# Generated: 2026-07-19
# Usage: add to your ~/.tmux.conf:
#   source-file ~/.tmux/themes/forest-ash.conf
# Or paste directly into ~/.tmux.conf

# ── Pane borders ──────────────────────────────────────────────────────────────
set -g pane-border-style "fg=#414339"
set -g pane-active-border-style "fg=#94C071"

# ── Status bar ────────────────────────────────────────────────────────────────
set -g status "on"
set -g status-bg "#282E2D"
set -g status-fg "#DCE5DF"
set -g status-left-style "fg=#DCE5DF,bg=#17201C"
set -g status-right-style "fg=#DCE5DF,bg=#17201C"
set -g status-left " #[fg=#DCE5DF,bold]#S #[fg=#414339]│ "
set -g status-right "#[fg=#8FA79A] %H:%M #[fg=#414339]│ #[fg=#DCE5DF]#H "

# ── Window tabs ───────────────────────────────────────────────────────────────
set -g window-status-style "fg=#8FA79A,bg=#17201C"
set -g window-status-current-style "fg=#94C071,bg=#0E1412,bold"
set -g window-status-format "  #I:#W  "
set -g window-status-current-format " #[fg=#94C071]▎#[fg=#DCE5DF]#I:#W  "
set -g window-status-separator ""

# ── Messages ──────────────────────────────────────────────────────────────────
set -g message-style "fg=#DCE5DF,bg=#17201C"
set -g message-command-style "fg=#DCE5DF,bg=#17201C"

# ── Selection ─────────────────────────────────────────────────────────────────
set -g mode-style "fg=#0E1412,bg=#94C071"

# ── Clock ─────────────────────────────────────────────────────────────────────
set -g clock-mode-colour "#94C071"

# ── Copy mode ─────────────────────────────────────────────────────────────────
set -wg copy-mode-match-style "fg=#0E1412,bg=#6FAF97"
set -wg copy-mode-current-match-style "fg=#0E1412,bg=#94C071"
