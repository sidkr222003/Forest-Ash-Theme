# Forest Ash Theme — tmux Configuration
# Generated: 2026-07-19
# Usage: add to your ~/.tmux.conf:
#   source-file ~/.tmux/themes/forest-ash.conf
# Or paste directly into ~/.tmux.conf

# ── Pane borders ──────────────────────────────────────────────────────────────
set -g pane-border-style "fg=#3A466D"
set -g pane-active-border-style "fg=#A9B0ED"

# ── Status bar ────────────────────────────────────────────────────────────────
set -g status "on"
set -g status-bg "#1D2435"
set -g status-fg "#DADDED"
set -g status-left-style "fg=#DADDED,bg=#131826"
set -g status-right-style "fg=#DADDED,bg=#131826"
set -g status-left " #[fg=#DADDED,bold]#S #[fg=#3A466D]│ "
set -g status-right "#[fg=#7F86A0] %H:%M #[fg=#3A466D]│ #[fg=#DADDED]#H "

# ── Window tabs ───────────────────────────────────────────────────────────────
set -g window-status-style "fg=#7F86A0,bg=#131826"
set -g window-status-current-style "fg=#A9B0ED,bg=#11131A,bold"
set -g window-status-format "  #I:#W  "
set -g window-status-current-format " #[fg=#A9B0ED]▎#[fg=#DADDED]#I:#W  "
set -g window-status-separator ""

# ── Messages ──────────────────────────────────────────────────────────────────
set -g message-style "fg=#DADDED,bg=#131826"
set -g message-command-style "fg=#DADDED,bg=#131826"

# ── Selection ─────────────────────────────────────────────────────────────────
set -g mode-style "fg=#11131A,bg=#A9B0ED"

# ── Clock ─────────────────────────────────────────────────────────────────────
set -g clock-mode-colour "#A9B0ED"

# ── Copy mode ─────────────────────────────────────────────────────────────────
set -wg copy-mode-match-style "fg=#11131A,bg=#9FA6E8"
set -wg copy-mode-current-match-style "fg=#11131A,bg=#A9B0ED"
