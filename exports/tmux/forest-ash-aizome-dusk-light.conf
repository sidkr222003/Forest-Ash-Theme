# Forest Ash Theme — tmux Configuration
# Generated: 2026-07-19
# Usage: add to your ~/.tmux.conf:
#   source-file ~/.tmux/themes/forest-ash.conf
# Or paste directly into ~/.tmux.conf

# ── Pane borders ──────────────────────────────────────────────────────────────
set -g pane-border-style "fg=#A7BAD2"
set -g pane-active-border-style "fg=#25374B"

# ── Status bar ────────────────────────────────────────────────────────────────
set -g status "on"
set -g status-bg "#EBEFF5"
set -g status-fg "#25374B"
set -g status-left-style "fg=#25374B,bg=#EBEFF4"
set -g status-right-style "fg=#25374B,bg=#EBEFF4"
set -g status-left " #[fg=#25374B,bold]#S #[fg=#A7BAD2]│ "
set -g status-right "#[fg=#667D99] %H:%M #[fg=#A7BAD2]│ #[fg=#25374B]#H "

# ── Window tabs ───────────────────────────────────────────────────────────────
set -g window-status-style "fg=#667D99,bg=#EBEFF4"
set -g window-status-current-style "fg=#25374B,bg=#F5F7F9,bold"
set -g window-status-format "  #I:#W  "
set -g window-status-current-format " #[fg=#25374B]▎#[fg=#25374B]#I:#W  "
set -g window-status-separator ""

# ── Messages ──────────────────────────────────────────────────────────────────
set -g message-style "fg=#25374B,bg=#EBEFF4"
set -g message-command-style "fg=#25374B,bg=#EBEFF4"

# ── Selection ─────────────────────────────────────────────────────────────────
set -g mode-style "fg=#F5F7F9,bg=#25374B"

# ── Clock ─────────────────────────────────────────────────────────────────────
set -g clock-mode-colour "#25374B"

# ── Copy mode ─────────────────────────────────────────────────────────────────
set -wg copy-mode-match-style "fg=#F5F7F9,bg=#325386"
set -wg copy-mode-current-match-style "fg=#F5F7F9,bg=#25374B"
