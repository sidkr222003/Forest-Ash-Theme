# Forest Ash Theme — tmux Configuration
# Generated: 2026-07-19
# Usage: add to your ~/.tmux.conf:
#   source-file ~/.tmux/themes/forest-ash.conf
# Or paste directly into ~/.tmux.conf

# ── Pane borders ──────────────────────────────────────────────────────────────
set -g pane-border-style "fg=#2F3D38"
set -g pane-active-border-style "fg=#86BFA8"

# ── Status bar ────────────────────────────────────────────────────────────────
set -g status "on"
set -g status-bg "#202729"
set -g status-fg "#D7DDD7"
set -g status-left-style "fg=#D7DDD7,bg=#151A1D"
set -g status-right-style "fg=#D7DDD7,bg=#151A1D"
set -g status-left " #[fg=#D7DDD7,bold]#S #[fg=#2F3D38]│ "
set -g status-right "#[fg=#7F8C89] %H:%M #[fg=#2F3D38]│ #[fg=#D7DDD7]#H "

# ── Window tabs ───────────────────────────────────────────────────────────────
set -g window-status-style "fg=#7F8C89,bg=#151A1D"
set -g window-status-current-style "fg=#86BFA8,bg=#111417,bold"
set -g window-status-format "  #I:#W  "
set -g window-status-current-format " #[fg=#86BFA8]▎#[fg=#D7DDD7]#I:#W  "
set -g window-status-separator ""

# ── Messages ──────────────────────────────────────────────────────────────────
set -g message-style "fg=#D7DDD7,bg=#151A1D"
set -g message-command-style "fg=#D7DDD7,bg=#151A1D"

# ── Selection ─────────────────────────────────────────────────────────────────
set -g mode-style "fg=#111417,bg=#86BFA8"

# ── Clock ─────────────────────────────────────────────────────────────────────
set -g clock-mode-colour "#86BFA8"

# ── Copy mode ─────────────────────────────────────────────────────────────────
set -wg copy-mode-match-style "fg=#111417,bg=#8EC7B0"
set -wg copy-mode-current-match-style "fg=#111417,bg=#86BFA8"
