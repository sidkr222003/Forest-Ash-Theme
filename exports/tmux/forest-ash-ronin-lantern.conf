# Forest Ash Theme — tmux Configuration
# Generated: 2026-07-19
# Usage: add to your ~/.tmux.conf:
#   source-file ~/.tmux/themes/forest-ash.conf
# Or paste directly into ~/.tmux.conf

# ── Pane borders ──────────────────────────────────────────────────────────────
set -g pane-border-style "fg=#523D30"
set -g pane-active-border-style "fg=#D5A26D"

# ── Status bar ────────────────────────────────────────────────────────────────
set -g status "on"
set -g status-bg "#251D18"
set -g status-fg "#E2D8CF"
set -g status-left-style "fg=#E2D8CF,bg=#181411"
set -g status-right-style "fg=#E2D8CF,bg=#181411"
set -g status-left " #[fg=#E2D8CF,bold]#S #[fg=#523D30]│ "
set -g status-right "#[fg=#918377] %H:%M #[fg=#523D30]│ #[fg=#E2D8CF]#H "

# ── Window tabs ───────────────────────────────────────────────────────────────
set -g window-status-style "fg=#918377,bg=#181411"
set -g window-status-current-style "fg=#D5A26D,bg=#14110F,bold"
set -g window-status-format "  #I:#W  "
set -g window-status-current-format " #[fg=#D5A26D]▎#[fg=#E2D8CF]#I:#W  "
set -g window-status-separator ""

# ── Messages ──────────────────────────────────────────────────────────────────
set -g message-style "fg=#E2D8CF,bg=#181411"
set -g message-command-style "fg=#E2D8CF,bg=#181411"

# ── Selection ─────────────────────────────────────────────────────────────────
set -g mode-style "fg=#14110F,bg=#D5A26D"

# ── Clock ─────────────────────────────────────────────────────────────────────
set -g clock-mode-colour "#D5A26D"

# ── Copy mode ─────────────────────────────────────────────────────────────────
set -wg copy-mode-match-style "fg=#14110F,bg=#D6A46F"
set -wg copy-mode-current-match-style "fg=#14110F,bg=#D5A26D"
