# Forest Ash Theme — tmux Configuration
# Generated: 2026-07-19
# Usage: add to your ~/.tmux.conf:
#   source-file ~/.tmux/themes/forest-ash.conf
# Or paste directly into ~/.tmux.conf

# ── Pane borders ──────────────────────────────────────────────────────────────
set -g pane-border-style "fg=#ADCDBE"
set -g pane-active-border-style "fg=#304033"

# ── Status bar ────────────────────────────────────────────────────────────────
set -g status "on"
set -g status-bg "#EDF3F0"
set -g status-fg "#304033"
set -g status-left-style "fg=#304033,bg=#EDF3F0"
set -g status-right-style "fg=#304033,bg=#EDF3F0"
set -g status-left " #[fg=#304033,bold]#S #[fg=#ADCDBE]│ "
set -g status-right "#[fg=#669976] %H:%M #[fg=#ADCDBE]│ #[fg=#304033]#H "

# ── Window tabs ───────────────────────────────────────────────────────────────
set -g window-status-style "fg=#669976,bg=#EDF3F0"
set -g window-status-current-style "fg=#304033,bg=#F6F9F7,bold"
set -g window-status-format "  #I:#W  "
set -g window-status-current-format " #[fg=#304033]▎#[fg=#304033]#I:#W  "
set -g window-status-separator ""

# ── Messages ──────────────────────────────────────────────────────────────────
set -g message-style "fg=#304033,bg=#EDF3F0"
set -g message-command-style "fg=#304033,bg=#EDF3F0"

# ── Selection ─────────────────────────────────────────────────────────────────
set -g mode-style "fg=#F6F9F7,bg=#304033"

# ── Clock ─────────────────────────────────────────────────────────────────────
set -g clock-mode-colour "#304033"

# ── Copy mode ─────────────────────────────────────────────────────────────────
set -wg copy-mode-match-style "fg=#F6F9F7,bg=#328657"
set -wg copy-mode-current-match-style "fg=#F6F9F7,bg=#304033"
