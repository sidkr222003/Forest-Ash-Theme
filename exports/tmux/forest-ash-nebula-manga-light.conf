# Forest Ash Theme — tmux Configuration
# Generated: 2026-07-19
# Usage: add to your ~/.tmux.conf:
#   source-file ~/.tmux/themes/forest-ash.conf
# Or paste directly into ~/.tmux.conf

# ── Pane borders ──────────────────────────────────────────────────────────────
set -g pane-border-style "fg=#A8B2D1"
set -g pane-active-border-style "fg=#252B4B"

# ── Status bar ────────────────────────────────────────────────────────────────
set -g status "on"
set -g status-bg "#EBEEF4"
set -g status-fg "#252B4B"
set -g status-left-style "fg=#252B4B,bg=#EBEDF5"
set -g status-right-style "fg=#252B4B,bg=#EBEDF5"
set -g status-left " #[fg=#252B4B,bold]#S #[fg=#A8B2D1]│ "
set -g status-right "#[fg=#667199] %H:%M #[fg=#A8B2D1]│ #[fg=#252B4B]#H "

# ── Window tabs ───────────────────────────────────────────────────────────────
set -g window-status-style "fg=#667199,bg=#EBEDF5"
set -g window-status-current-style "fg=#252B4B,bg=#F6F6F9,bold"
set -g window-status-format "  #I:#W  "
set -g window-status-current-format " #[fg=#252B4B]▎#[fg=#252B4B]#I:#W  "
set -g window-status-separator ""

# ── Messages ──────────────────────────────────────────────────────────────────
set -g message-style "fg=#252B4B,bg=#EBEDF5"
set -g message-command-style "fg=#252B4B,bg=#EBEDF5"

# ── Selection ─────────────────────────────────────────────────────────────────
set -g mode-style "fg=#F6F6F9,bg=#252B4B"

# ── Clock ─────────────────────────────────────────────────────────────────────
set -g clock-mode-colour "#252B4B"

# ── Copy mode ─────────────────────────────────────────────────────────────────
set -wg copy-mode-match-style "fg=#F6F6F9,bg=#323A86"
set -wg copy-mode-current-match-style "fg=#F6F6F9,bg=#252B4B"
