# Forest Ash Theme — tmux Configuration
# Generated: 2026-07-19
# Usage: add to your ~/.tmux.conf:
#   source-file ~/.tmux/themes/forest-ash.conf
# Or paste directly into ~/.tmux.conf

# ── Pane borders ──────────────────────────────────────────────────────────────
set -g pane-border-style "fg=#ADC3CD"
set -g pane-active-border-style "fg=#2E3C42"

# ── Status bar ────────────────────────────────────────────────────────────────
set -g status "on"
set -g status-bg "#ECF1F3"
set -g status-fg "#2E3C42"
set -g status-left-style "fg=#2E3C42,bg=#ECF0F3"
set -g status-right-style "fg=#2E3C42,bg=#ECF0F3"
set -g status-left " #[fg=#2E3C42,bold]#S #[fg=#ADC3CD]│ "
set -g status-right "#[fg=#668899] %H:%M #[fg=#ADC3CD]│ #[fg=#2E3C42]#H "

# ── Window tabs ───────────────────────────────────────────────────────────────
set -g window-status-style "fg=#668899,bg=#ECF0F3"
set -g window-status-current-style "fg=#2E3C42,bg=#F6F8F9,bold"
set -g window-status-format "  #I:#W  "
set -g window-status-current-format " #[fg=#2E3C42]▎#[fg=#2E3C42]#I:#W  "
set -g window-status-separator ""

# ── Messages ──────────────────────────────────────────────────────────────────
set -g message-style "fg=#2E3C42,bg=#ECF0F3"
set -g message-command-style "fg=#2E3C42,bg=#ECF0F3"

# ── Selection ─────────────────────────────────────────────────────────────────
set -g mode-style "fg=#F6F8F9,bg=#2E3C42"

# ── Clock ─────────────────────────────────────────────────────────────────────
set -g clock-mode-colour "#2E3C42"

# ── Copy mode ─────────────────────────────────────────────────────────────────
set -wg copy-mode-match-style "fg=#F6F8F9,bg=#327286"
set -wg copy-mode-current-match-style "fg=#F6F8F9,bg=#2E3C42"
