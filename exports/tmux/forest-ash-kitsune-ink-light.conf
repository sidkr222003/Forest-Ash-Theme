# Forest Ash Theme — tmux Configuration
# Generated: 2026-07-19
# Usage: add to your ~/.tmux.conf:
#   source-file ~/.tmux/themes/forest-ash.conf
# Or paste directly into ~/.tmux.conf

# ── Pane borders ──────────────────────────────────────────────────────────────
set -g pane-border-style "fg=#CABAAF"
set -g pane-active-border-style "fg=#41382F"

# ── Status bar ────────────────────────────────────────────────────────────────
set -g status "on"
set -g status-bg "#F2EFED"
set -g status-fg "#41382F"
set -g status-left-style "fg=#41382F,bg=#F2EFEE"
set -g status-right-style "fg=#41382F,bg=#F2EFEE"
set -g status-left " #[fg=#41382F,bold]#S #[fg=#CABAAF]│ "
set -g status-right "#[fg=#997D66] %H:%M #[fg=#CABAAF]│ #[fg=#41382F]#H "

# ── Window tabs ───────────────────────────────────────────────────────────────
set -g window-status-style "fg=#997D66,bg=#F2EFEE"
set -g window-status-current-style "fg=#41382F,bg=#F8F6F6,bold"
set -g window-status-format "  #I:#W  "
set -g window-status-current-format " #[fg=#41382F]▎#[fg=#41382F]#I:#W  "
set -g window-status-separator ""

# ── Messages ──────────────────────────────────────────────────────────────────
set -g message-style "fg=#41382F,bg=#F2EFEE"
set -g message-command-style "fg=#41382F,bg=#F2EFEE"

# ── Selection ─────────────────────────────────────────────────────────────────
set -g mode-style "fg=#F8F6F6,bg=#41382F"

# ── Clock ─────────────────────────────────────────────────────────────────────
set -g clock-mode-colour "#41382F"

# ── Copy mode ─────────────────────────────────────────────────────────────────
set -wg copy-mode-match-style "fg=#F8F6F6,bg=#865832"
set -wg copy-mode-current-match-style "fg=#F8F6F6,bg=#41382F"
