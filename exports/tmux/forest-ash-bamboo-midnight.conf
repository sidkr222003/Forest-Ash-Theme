# Forest Ash Theme — tmux Configuration
# Generated: 2026-07-19
# Usage: add to your ~/.tmux.conf:
#   source-file ~/.tmux/themes/forest-ash.conf
# Or paste directly into ~/.tmux.conf

# ── Pane borders ──────────────────────────────────────────────────────────────
set -g pane-border-style "fg=#315042"
set -g pane-active-border-style "fg=#8ECFAE"

# ── Status bar ────────────────────────────────────────────────────────────────
set -g status "on"
set -g status-bg "#1C2A23"
set -g status-fg "#D7E1D9"
set -g status-left-style "fg=#D7E1D9,bg=#131C18"
set -g status-right-style "fg=#D7E1D9,bg=#131C18"
set -g status-left " #[fg=#D7E1D9,bold]#S #[fg=#315042]│ "
set -g status-right "#[fg=#7A8D80] %H:%M #[fg=#315042]│ #[fg=#D7E1D9]#H "

# ── Window tabs ───────────────────────────────────────────────────────────────
set -g window-status-style "fg=#7A8D80,bg=#131C18"
set -g window-status-current-style "fg=#8ECFAE,bg=#0F1512,bold"
set -g window-status-format "  #I:#W  "
set -g window-status-current-format " #[fg=#8ECFAE]▎#[fg=#D7E1D9]#I:#W  "
set -g window-status-separator ""

# ── Messages ──────────────────────────────────────────────────────────────────
set -g message-style "fg=#D7E1D9,bg=#131C18"
set -g message-command-style "fg=#D7E1D9,bg=#131C18"

# ── Selection ─────────────────────────────────────────────────────────────────
set -g mode-style "fg=#0F1512,bg=#8ECFAE"

# ── Clock ─────────────────────────────────────────────────────────────────────
set -g clock-mode-colour "#8ECFAE"

# ── Copy mode ─────────────────────────────────────────────────────────────────
set -wg copy-mode-match-style "fg=#0F1512,bg=#86C3A1"
set -wg copy-mode-current-match-style "fg=#0F1512,bg=#8ECFAE"
