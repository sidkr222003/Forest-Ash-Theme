# Forest Ash Theme — tmux Configuration
# Generated: 2026-07-19
# Usage: add to your ~/.tmux.conf:
#   source-file ~/.tmux/themes/forest-ash.conf
# Or paste directly into ~/.tmux.conf

# ── Pane borders ──────────────────────────────────────────────────────────────
set -g pane-border-style "fg=#B0C9C3"
set -g pane-active-border-style "fg=#313F35"

# ── Status bar ────────────────────────────────────────────────────────────────
set -g status "on"
set -g status-bg "#EEF2F1"
set -g status-fg "#313F35"
set -g status-left-style "fg=#313F35,bg=#EEF2F1"
set -g status-right-style "fg=#313F35,bg=#EEF2F1"
set -g status-left " #[fg=#313F35,bold]#S #[fg=#B0C9C3]│ "
set -g status-right "#[fg=#66998B] %H:%M #[fg=#B0C9C3]│ #[fg=#313F35]#H "

# ── Window tabs ───────────────────────────────────────────────────────────────
set -g window-status-style "fg=#66998B,bg=#EEF2F1"
set -g window-status-current-style "fg=#313F35,bg=#F6F8F8,bold"
set -g window-status-format "  #I:#W  "
set -g window-status-current-format " #[fg=#313F35]▎#[fg=#313F35]#I:#W  "
set -g window-status-separator ""

# ── Messages ──────────────────────────────────────────────────────────────────
set -g message-style "fg=#313F35,bg=#EEF2F1"
set -g message-command-style "fg=#313F35,bg=#EEF2F1"

# ── Selection ─────────────────────────────────────────────────────────────────
set -g mode-style "fg=#F6F8F8,bg=#313F35"

# ── Clock ─────────────────────────────────────────────────────────────────────
set -g clock-mode-colour "#313F35"

# ── Copy mode ─────────────────────────────────────────────────────────────────
set -wg copy-mode-match-style "fg=#F6F8F8,bg=#328668"
set -wg copy-mode-current-match-style "fg=#F6F8F8,bg=#313F35"
