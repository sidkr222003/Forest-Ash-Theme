# Forest Ash Theme — tmux Configuration
# Generated: 2026-07-19
# Usage: add to your ~/.tmux.conf:
#   source-file ~/.tmux/themes/forest-ash.conf
# Or paste directly into ~/.tmux.conf

# ── Pane borders ──────────────────────────────────────────────────────────────
set -g pane-border-style "fg=#CAB0BE"
set -g pane-active-border-style "fg=#412F39"

# ── Status bar ────────────────────────────────────────────────────────────────
set -g status "on"
set -g status-bg "#F2EEF0"
set -g status-fg "#412F39"
set -g status-left-style "fg=#412F39,bg=#F2EEF1"
set -g status-right-style "fg=#412F39,bg=#F2EEF1"
set -g status-left " #[fg=#412F39,bold]#S #[fg=#CAB0BE]│ "
set -g status-right "#[fg=#996682] %H:%M #[fg=#CAB0BE]│ #[fg=#412F39]#H "

# ── Window tabs ───────────────────────────────────────────────────────────────
set -g window-status-style "fg=#996682,bg=#F2EEF1"
set -g window-status-current-style "fg=#412F39,bg=#F8F6F8,bold"
set -g window-status-format "  #I:#W  "
set -g window-status-current-format " #[fg=#412F39]▎#[fg=#412F39]#I:#W  "
set -g window-status-separator ""

# ── Messages ──────────────────────────────────────────────────────────────────
set -g message-style "fg=#412F39,bg=#F2EEF1"
set -g message-command-style "fg=#412F39,bg=#F2EEF1"

# ── Selection ─────────────────────────────────────────────────────────────────
set -g mode-style "fg=#F8F6F8,bg=#412F39"

# ── Clock ─────────────────────────────────────────────────────────────────────
set -g clock-mode-colour "#412F39"

# ── Copy mode ─────────────────────────────────────────────────────────────────
set -wg copy-mode-match-style "fg=#F8F6F8,bg=#863259"
set -wg copy-mode-current-match-style "fg=#F8F6F8,bg=#412F39"
