# Forest Ash Theme — tmux Configuration
# Generated: 2026-07-19
# Usage: add to your ~/.tmux.conf:
#   source-file ~/.tmux/themes/forest-ash.conf
# Or paste directly into ~/.tmux.conf

# ── Pane borders ──────────────────────────────────────────────────────────────
set -g pane-border-style "fg=#37504A"
set -g pane-active-border-style "fg=#A6C0B6"

# ── Status bar ────────────────────────────────────────────────────────────────
set -g status "on"
set -g status-bg "#1F2826"
set -g status-fg "#DBDFDC"
set -g status-left-style "fg=#DBDFDC,bg=#141A19"
set -g status-right-style "fg=#DBDFDC,bg=#141A19"
set -g status-left " #[fg=#DBDFDC,bold]#S #[fg=#37504A]│ "
set -g status-right "#[fg=#838E8B] %H:%M #[fg=#37504A]│ #[fg=#DBDFDC]#H "

# ── Window tabs ───────────────────────────────────────────────────────────────
set -g window-status-style "fg=#838E8B,bg=#141A19"
set -g window-status-current-style "fg=#A6C0B6,bg=#121515,bold"
set -g window-status-format "  #I:#W  "
set -g window-status-current-format " #[fg=#A6C0B6]▎#[fg=#DBDFDC]#I:#W  "
set -g window-status-separator ""

# ── Messages ──────────────────────────────────────────────────────────────────
set -g message-style "fg=#DBDFDC,bg=#141A19"
set -g message-command-style "fg=#DBDFDC,bg=#141A19"

# ── Selection ─────────────────────────────────────────────────────────────────
set -g mode-style "fg=#121515,bg=#A6C0B6"

# ── Clock ─────────────────────────────────────────────────────────────────────
set -g clock-mode-colour "#A6C0B6"

# ── Copy mode ─────────────────────────────────────────────────────────────────
set -wg copy-mode-match-style "fg=#121515,bg=#9CB8AE"
set -wg copy-mode-current-match-style "fg=#121515,bg=#A6C0B6"
