# Forest Ash Theme — tmux Configuration
# Generated: 2026-07-19
# Usage: add to your ~/.tmux.conf:
#   source-file ~/.tmux/themes/forest-ash.conf
# Or paste directly into ~/.tmux.conf

# ── Pane borders ──────────────────────────────────────────────────────────────
set -g pane-border-style "fg=#36324A"
set -g pane-active-border-style "fg=#B9A9DD"

# ── Status bar ────────────────────────────────────────────────────────────────
set -g status "on"
set -g status-bg "#21202C"
set -g status-fg "#DCD9E3"
set -g status-left-style "fg=#DCD9E3,bg=#15151C"
set -g status-right-style "fg=#DCD9E3,bg=#15151C"
set -g status-left " #[fg=#DCD9E3,bold]#S #[fg=#36324A]│ "
set -g status-right "#[fg=#878194] %H:%M #[fg=#36324A]│ #[fg=#DCD9E3]#H "

# ── Window tabs ───────────────────────────────────────────────────────────────
set -g window-status-style "fg=#878194,bg=#15151C"
set -g window-status-current-style "fg=#B9A9DD,bg=#121217,bold"
set -g window-status-format "  #I:#W  "
set -g window-status-current-format " #[fg=#B9A9DD]▎#[fg=#DCD9E3]#I:#W  "
set -g window-status-separator ""

# ── Messages ──────────────────────────────────────────────────────────────────
set -g message-style "fg=#DCD9E3,bg=#15151C"
set -g message-command-style "fg=#DCD9E3,bg=#15151C"

# ── Selection ─────────────────────────────────────────────────────────────────
set -g mode-style "fg=#121217,bg=#B9A9DD"

# ── Clock ─────────────────────────────────────────────────────────────────────
set -g clock-mode-colour "#B9A9DD"

# ── Copy mode ─────────────────────────────────────────────────────────────────
set -wg copy-mode-match-style "fg=#121217,bg=#AFA0D6"
set -wg copy-mode-current-match-style "fg=#121217,bg=#B9A9DD"
