# Forest Ash Theme — tmux Configuration
# Generated: 2026-07-19
# Usage: add to your ~/.tmux.conf:
#   source-file ~/.tmux/themes/forest-ash.conf
# Or paste directly into ~/.tmux.conf

# ── Pane borders ──────────────────────────────────────────────────────────────
set -g pane-border-style "fg=#483A30"
set -g pane-active-border-style "fg=#D9A57B"

# ── Status bar ────────────────────────────────────────────────────────────────
set -g status "on"
set -g status-bg "#241E1A"
set -g status-fg "#DED8D2"
set -g status-left-style "fg=#DED8D2,bg=#181513"
set -g status-right-style "fg=#DED8D2,bg=#181513"
set -g status-left " #[fg=#DED8D2,bold]#S #[fg=#483A30]│ "
set -g status-right "#[fg=#8D837B] %H:%M #[fg=#483A30]│ #[fg=#DED8D2]#H "

# ── Window tabs ───────────────────────────────────────────────────────────────
set -g window-status-style "fg=#8D837B,bg=#181513"
set -g window-status-current-style "fg=#D9A57B,bg=#141313,bold"
set -g window-status-format "  #I:#W  "
set -g window-status-current-format " #[fg=#D9A57B]▎#[fg=#DED8D2]#I:#W  "
set -g window-status-separator ""

# ── Messages ──────────────────────────────────────────────────────────────────
set -g message-style "fg=#DED8D2,bg=#181513"
set -g message-command-style "fg=#DED8D2,bg=#181513"

# ── Selection ─────────────────────────────────────────────────────────────────
set -g mode-style "fg=#141313,bg=#D9A57B"

# ── Clock ─────────────────────────────────────────────────────────────────────
set -g clock-mode-colour "#D9A57B"

# ── Copy mode ─────────────────────────────────────────────────────────────────
set -wg copy-mode-match-style "fg=#141313,bg=#D4A57D"
set -wg copy-mode-current-match-style "fg=#141313,bg=#D9A57B"
