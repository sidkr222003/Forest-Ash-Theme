# Forest Ash Theme — tmux Configuration
# Generated: 2026-07-19
# Usage: add to your ~/.tmux.conf:
#   source-file ~/.tmux/themes/forest-ash.conf
# Or paste directly into ~/.tmux.conf

# ── Pane borders ──────────────────────────────────────────────────────────────
set -g pane-border-style "fg=#563A49"
set -g pane-active-border-style "fg=#D8A8BE"

# ── Status bar ────────────────────────────────────────────────────────────────
set -g status "on"
set -g status-bg "#271E24"
set -g status-fg "#E3D8DE"
set -g status-left-style "fg=#E3D8DE,bg=#191318"
set -g status-right-style "fg=#E3D8DE,bg=#191318"
set -g status-left " #[fg=#E3D8DE,bold]#S #[fg=#563A49]│ "
set -g status-right "#[fg=#96828D] %H:%M #[fg=#563A49]│ #[fg=#E3D8DE]#H "

# ── Window tabs ───────────────────────────────────────────────────────────────
set -g window-status-style "fg=#96828D,bg=#191318"
set -g window-status-current-style "fg=#D8A8BE,bg=#151214,bold"
set -g window-status-format "  #I:#W  "
set -g window-status-current-format " #[fg=#D8A8BE]▎#[fg=#E3D8DE]#I:#W  "
set -g window-status-separator ""

# ── Messages ──────────────────────────────────────────────────────────────────
set -g message-style "fg=#E3D8DE,bg=#191318"
set -g message-command-style "fg=#E3D8DE,bg=#191318"

# ── Selection ─────────────────────────────────────────────────────────────────
set -g mode-style "fg=#151214,bg=#D8A8BE"

# ── Clock ─────────────────────────────────────────────────────────────────────
set -g clock-mode-colour "#D8A8BE"

# ── Copy mode ─────────────────────────────────────────────────────────────────
set -wg copy-mode-match-style "fg=#151214,bg=#D4A0B8"
set -wg copy-mode-current-match-style "fg=#151214,bg=#D8A8BE"
