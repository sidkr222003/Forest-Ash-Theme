# Forest Ash Theme — tmux Configuration
# Generated: 2026-07-19
# Usage: add to your ~/.tmux.conf:
#   source-file ~/.tmux/themes/forest-ash.conf
# Or paste directly into ~/.tmux.conf

# ── Pane borders ──────────────────────────────────────────────────────────────
set -g pane-border-style "fg=#344A66"
set -g pane-active-border-style "fg=#8EACE2"

# ── Status bar ────────────────────────────────────────────────────────────────
set -g status "on"
set -g status-bg "#1C2736"
set -g status-fg "#D5DFEA"
set -g status-left-style "fg=#D5DFEA,bg=#131A24"
set -g status-right-style "fg=#D5DFEA,bg=#131A24"
set -g status-left " #[fg=#D5DFEA,bold]#S #[fg=#344A66]│ "
set -g status-right "#[fg=#79889A] %H:%M #[fg=#344A66]│ #[fg=#D5DFEA]#H "

# ── Window tabs ───────────────────────────────────────────────────────────────
set -g window-status-style "fg=#79889A,bg=#131A24"
set -g window-status-current-style "fg=#8EACE2,bg=#10141B,bold"
set -g window-status-format "  #I:#W  "
set -g window-status-current-format " #[fg=#8EACE2]▎#[fg=#D5DFEA]#I:#W  "
set -g window-status-separator ""

# ── Messages ──────────────────────────────────────────────────────────────────
set -g message-style "fg=#D5DFEA,bg=#131A24"
set -g message-command-style "fg=#D5DFEA,bg=#131A24"

# ── Selection ─────────────────────────────────────────────────────────────────
set -g mode-style "fg=#10141B,bg=#8EACE2"

# ── Clock ─────────────────────────────────────────────────────────────────────
set -g clock-mode-colour "#8EACE2"

# ── Copy mode ─────────────────────────────────────────────────────────────────
set -wg copy-mode-match-style "fg=#10141B,bg=#7FA3D9"
set -wg copy-mode-current-match-style "fg=#10141B,bg=#8EACE2"
