# Forest Ash Theme — Alacritty Configuration
# Generated: 2026-07-19
# Usage: paste into your alacritty.toml, or import with:
#   [general]
#   import = ["~/.config/alacritty/themes/forest-ash.toml"]
#
# Alacritty ≥ 0.13 TOML format

[colors.primary]
background = "#10161A"
foreground = "#D8E0E4"

[colors.cursor]
text   = "#10161A"
cursor = "#8BC6D9"

[colors.selection]
text       = "#D8E0E4"
background = "#2D4D59"

[colors.normal]
black   = "#182026"
red     = "#CA8484"
green   = "#8AC0A9"
yellow  = "#C2B47E"
blue    = "#7BA9CD"
magenta = "#A795D2"
cyan    = "#7EC4CF"
white   = "#D8E0E4"

[colors.bright]
black   = "#4F565A"
red     = "#D69F9F"
green   = "#A4CEBC"
yellow  = "#CFC59A"
blue    = "#98BCD8"
magenta = "#BAACDC"
cyan    = "#9AD1DA"
white   = "#DBE2E6"

# Semantic colors (not standard Alacritty, for reference)
# accent   = "#8BC6D9"
# keyword  = "#C2B47E"
# string   = "#87BFD0"
# function = "#BFE4F1"
# type     = "#9FD5E6"
# comment  = "#7A8A92"
