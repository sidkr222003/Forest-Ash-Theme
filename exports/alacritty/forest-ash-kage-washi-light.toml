[colors.selection]
text       = "#313F35"
background = "#C7DBD5"

[colors.normal]
black   = "#7397FA"
red     = "#3AC921"
green   = "#397F5D"
yellow  = "#A38933"
blue    = "#3C639A"
magenta = "#65469B"
cyan    = "#678D57"
white   = "#1D554D"

[colors.bright]
black   = "#7E90C7"
red     = "#53ED2E"
green   = "#41AA76"
yellow  = "#CCA933"
blue    = "#4176C3"
magenta = "#61818D"
cyan    = "#BE3ADC"
white   = "#EF2D49"

# Semantic colors (not standard Alacritty, for reference)
# accent   = "#313F35"
# keyword  = "#288665"
# string   = "#328668"
# function = "#29654D"
