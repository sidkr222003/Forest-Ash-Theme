<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <!-- Background -->
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0%"   stop-color="#1c2e1f"/>
      <stop offset="55%"  stop-color="#101a11"/>
      <stop offset="100%" stop-color="#060c07"/>
    </radialGradient>

    <!-- Moon atmosphere -->
    <radialGradient id="moonAtmos" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ddd4b0" stop-opacity="0.26"/>
      <stop offset="55%"  stop-color="#ddd4b0" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#ddd4b0" stop-opacity="0.00"/>
    </radialGradient>

    <!-- Leaf inner glow -->
    <radialGradient id="leafGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#8ad490" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8ad490" stop-opacity="0.00"/>
    </radialGradient>

    <!-- Soft moon blur -->
    <filter id="moonBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <!-- Particle glow -->
    <filter id="pGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Clip rounded square -->
    <clipPath id="sq">
      <rect width="256" height="256" rx="42"/>
    </clipPath>
  </defs>

  <!-- === BACKGROUND === -->
  <rect width="256" height="256" rx="42" fill="url(#bg)"/>

  <g clip-path="url(#sq)">

    <!-- Moon soft atmosphere -->
    <circle cx="128" cy="84" r="100" fill="url(#moonAtmos)" filter="url(#moonBlur)"/>

    <!-- Moon discs (concentric, painterly) -->
    <circle cx="128" cy="80" r="56"  fill="#ede5ca" fill-opacity="0.055"/>
    <circle cx="128" cy="80" r="42"  fill="#ede5ca" fill-opacity="0.060"/>
    <circle cx="128" cy="80" r="28"  fill="#ede5ca" fill-opacity="0.070"/>
    <circle cx="128" cy="80" r="14"  fill="#ede5ca" fill-opacity="0.085"/>

    <!-- Ash particles (soft glowing specks) -->
    <g fill="#d4dccf" filter="url(#pGlow)">
      <circle cx="72"  cy="64"  r="2.2" fill-opacity="0.55"/>
      <circle cx="184" cy="72"  r="1.8" fill-opacity="0.45"/>
      <circle cx="208" cy="120" r="2.0" fill-opacity="0.50"/>
      <circle cx="48"  cy="140" r="1.6" fill-opacity="0.40"/>
      <circle cx="96"  cy="180" r="2.4" fill-opacity="0.60"/>
      <circle cx="160" cy="192" r="1.8" fill-opacity="0.45"/>
      <circle cx="136" cy="140" r="1.4" fill-opacity="0.35"/>
      <circle cx="220" cy="176" r="2.0" fill-opacity="0.50"/>
    </g>

    <!-- Stylized leaf silhouette -->
    <path d="M128 228 
             C128 228 86 202 64 172 
             C48 150 42 126 48 108 
             C54 90 68 84 84 88 
             C100 92 114 106 128 120 
             C142 106 156 92 172 88 
             C188 84 202 90 208 108 
             C214 126 208 150 192 172 
             C170 202 128 228 128 228 Z"
          fill="url(#leafGlow)"/>

    <!-- Leaf veins (subtle lines) -->
    <path d="M128 220 L128 120" stroke="#8ad490" stroke-width="2" stroke-opacity="0.18" stroke-linecap="round"/>
    <path d="M128 160 Q108 140 92 124" stroke="#8ad490" stroke-width="1.5" stroke-opacity="0.14" stroke-linecap="round"/>
    <path d="M128 160 Q148 140 164 124" stroke="#8ad490" stroke-width="1.5" stroke-opacity="0.14" stroke-linecap="round"/>
    <path d="M128 180 Q104 164 84 148" stroke="#8ad490" stroke-width="1.2" stroke-opacity="0.12" stroke-linecap="round"/>
    <path d="M128 180 Q152 164 172 148" stroke="#8ad490" stroke-width="1.2" stroke-opacity="0.12" stroke-linecap="round"/>

  </g>
</svg>
